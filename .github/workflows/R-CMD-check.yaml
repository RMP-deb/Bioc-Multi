# R CMD check + BiocCheck against Bioconductor devel (what the Bioconductor
# build system uses for new submissions), plus R CMD check on macOS and
# Windows. Derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master, devel]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  bioc-devel:
    runs-on: ubuntu-latest
    name: ubuntu (Bioconductor devel) + BiocCheck
    container: bioconductor/bioconductor_docker:devel

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          BiocManager::install(c("remotes", "rcmdcheck", "BiocCheck"),
                               ask = FALSE, update = FALSE)
          deps <- remotes::local_package_deps(dependencies = TRUE)
          BiocManager::install(deps, ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: R CMD check
        run: |
          rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--timings"),
            build_args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          tarball <- list.files("check", pattern = "\\.tar\\.gz$",
                                full.names = TRUE)
          BiocCheck::BiocCheck(
            tarball,
            `no-check-bioc-help` = TRUE,   # support-site registration
            `quit-with-status` = TRUE      # fail the job on BiocCheck errors
          )
        shell: Rscript {0}

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
